<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0A0E12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TRIP — لوحة حماية</title>
<style>
:root{
  --room:#0A0E12; --steel:#161C24; --steelHi:#1E2630; --edge:#2A3543;
  --plate:#8A97A6; --red:#FF3B30; --redDim:#4A1512; --hazard:#F5C518;
  --green:#3DDC97; --cyan:#38BDF8;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(120% 60% at 50% 0%, #131A22 0%, var(--room) 60%) no-repeat fixed;
  color:var(--plate); font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;padding:14px 12px 18px;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;
}
#app{width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}

.plate{background:linear-gradient(180deg,var(--steelHi),var(--steel));
  border:1px solid var(--edge);border-radius:4px;padding:9px 12px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;color:#5E6B7A;direction:ltr}
.lives{display:flex;gap:6px}
.led{width:9px;height:9px;border-radius:50%;background:#232C36;transition:background .2s}
.led.on{background:var(--green);box-shadow:0 0 8px var(--green)}

.scorerow{display:flex;align-items:flex-end;justify-content:space-between}
#score{font-family:var(--mono);font-size:40px;line-height:1;color:#E7EDF3;letter-spacing:-1px;direction:ltr}
.chips{display:flex;gap:8px;font-family:var(--mono);font-size:11px;direction:ltr}
.chip{border:1px solid var(--edge);border-radius:3px;padding:3px 7px}
.chip.hot{border-color:var(--hazard);color:var(--hazard)}

.bus{position:relative;height:14px;margin-bottom:-6px}
.bus i{position:absolute;background:var(--edge)}
.bus .rail{top:3px;left:6px;right:6px;height:2px}
.bus .stub{top:3px;width:2px;height:11px}

#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bay{position:relative;aspect-ratio:1/1.15;padding:0;border-radius:3px;overflow:hidden;
  border:1px solid var(--edge);background:linear-gradient(180deg,var(--steelHi),var(--steel));
  touch-action:none;cursor:pointer}
.bay .code{position:absolute;top:6px;left:0;right:0;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.5px;color:#6D7A89;direction:ltr;transition:opacity .12s}
.bay .lamp{position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);
  width:13px;height:13px;border-radius:50%;background:#20303B;
  font-family:var(--mono);font-size:9px;line-height:13px;text-align:center;color:#0A0E12;font-weight:700}
.bay .legend{position:absolute;bottom:12px;left:0;right:0;font-family:var(--mono);
  font-size:8.5px;letter-spacing:1.2px;direction:ltr;color:transparent;transition:opacity .12s}
.bay .bar{position:absolute;bottom:0;left:0;height:3px;width:0}
.bay .charge{position:absolute;bottom:0;left:0;right:0;height:0;background:rgba(56,189,248,.28)}
.bay .wash{position:absolute;inset:0;pointer-events:none}
.bay .tape{position:absolute;top:50%;left:-25%;width:150%;height:10px;display:none;
  background:repeating-linear-gradient(45deg,var(--hazard) 0 7px,#14130C 7px 14px)}
.bay .tape.a{transform:translateY(-50%) rotate(34deg)}
.bay .tape.b{transform:translateY(-50%) rotate(-34deg)}

.bay.fault,.bay.dbl{border-color:var(--red);background:linear-gradient(180deg,#2A1013,var(--redDim));
  box-shadow:0 0 20px rgba(255,59,48,.35)}
.bay.fault .code,.bay.dbl .code{color:#FFB3AE}
.bay.fault .lamp,.bay.dbl .lamp{background:var(--red);box-shadow:0 0 14px var(--red);animation:strobe .55s infinite}
.bay.fault .legend,.bay.dbl .legend{color:var(--red)}
.bay.fault .bar,.bay.dbl .bar{background:var(--red)}
.bay.dbl{border-width:3px}

.bay.hold{border-color:var(--cyan);background:linear-gradient(180deg,#0B2230,#08161F);
  box-shadow:0 0 20px rgba(56,189,248,.3)}
.bay.hold .code{color:#A9DDF8}
.bay.hold .lamp{background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.bay.hold .legend{color:var(--cyan)}
.bay.hold .bar{background:var(--cyan)}

.bay.lock{border-color:var(--hazard);background:linear-gradient(180deg,#1C1A10,#14130C)}
.bay.lock .tape{display:block}
.bay.lock .lamp{background:#14130C;border:2px solid var(--hazard)}
.bay.lock .legend{color:var(--hazard)}
.bay.lock .bar{background:var(--hazard)}

.bay.spare{border-color:var(--green);background:linear-gradient(180deg,#0C2A1E,#071A12);
  box-shadow:0 0 20px rgba(61,220,151,.3)}
.bay.spare .lamp{background:var(--green);box-shadow:0 0 14px var(--green);animation:strobe .8s infinite}
.bay.spare .legend{color:var(--green)}
.bay.spare .bar{background:var(--green)}
.bay.spare .code{color:#9BE9C8}

@keyframes strobe{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes fg{from{background:rgba(61,220,151,.4)}to{background:transparent}}
@keyframes fb{from{background:rgba(255,59,48,.5)}to{background:transparent}}
.bay.fxg .wash{animation:fg .3s ease-out}
.bay.fxb .wash{animation:fb .3s ease-out}

body.dark .bay{background:#0B0F14}
body.dark .bay .code,body.dark .bay .legend{opacity:0}
body.dark .tape{opacity:.22}
body.dark .plate,body.dark #log,body.dark .scorerow,body.dark .bus{opacity:.12}

#log{background:#0D1218;border:1px solid var(--edge);border-radius:4px;padding:8px 10px;
  font-family:var(--mono);font-size:10.5px;line-height:1.75;min-height:82px;direction:ltr}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ok{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--hazard)}
.info{color:var(--cyan)} .none{color:#3B4756}

#hap{align-self:center;background:none;border:none;color:#4E5B6A;font-size:12px;padding:4px;cursor:pointer}

#unlock{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:center;
  padding:10px 12px;pointer-events:none;transition:transform .25s,opacity .25s}
#unlock.hide{transform:translateY(-120%);opacity:0}
#unlock .box{width:100%;max-width:420px;background:#12181F;border:1px solid var(--red);
  border-radius:5px;padding:11px 14px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
#unlock .ar{font-size:14px;color:#E7EDF3;line-height:1.6}
#unlock .en{font-family:var(--mono);font-size:9.5px;letter-spacing:2px;color:var(--red);
  margin-top:5px;direction:ltr}

#over{position:fixed;inset:0;background:rgba(6,9,12,.94);display:flex;align-items:center;
  justify-content:center;padding:20px;z-index:9}
#over.hide{display:none}
.card{width:100%;max-width:340px;text-align:center}
.brand{font-family:var(--mono);font-size:46px;letter-spacing:6px;color:var(--red);
  text-shadow:0 0 24px var(--red);direction:ltr}
.sub{color:#5E6B7A;font-size:13px;margin-top:4px}
.rules{margin:22px 0;text-align:right;font-size:13.5px;line-height:1.95;
  background:var(--steel);border:1px solid var(--edge);border-radius:4px;padding:12px 14px}
.rules .hint{color:#5E6B7A;font-size:12.5px;margin-top:8px;border-top:1px solid var(--edge);padding-top:8px}
.result{margin:24px 0;font-family:var(--mono);color:#E7EDF3;direction:ltr}
.result b{display:block;font-size:44px;line-height:1;font-weight:400}
.result span{font-size:11px;color:#5E6B7A;display:block;margin-top:8px}
#go{width:100%;padding:14px 0;border-radius:4px;background:var(--red);border:none;
  color:#0A0E12;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<div id="unlock" class="hide"><div class="box"><div class="ar"></div><div class="en"></div></div></div>

<div id="app">
  <div class="plate">
    <div class="tag">380kV&nbsp; PROTECTION PANEL</div>
    <div class="lives" id="lives"></div>
  </div>

  <div class="scorerow">
    <div id="score">0000</div>
    <div class="chips">
      <span class="chip" id="lvl">LVL 1</span>
      <span class="chip" id="mult">x1</span>
    </div>
  </div>

  <div class="bus">
    <i class="rail"></i><i class="stub" style="left:16.6%"></i>
    <i class="stub" style="left:50%"></i><i class="stub" style="left:83.3%"></i>
  </div>

  <div id="grid"></div>
  <div id="log"><div class="none">-- NO EVENTS --</div></div>
  <button id="hap">الاهتزاز مفعّل</button>
</div>

<div id="over">
  <div class="card">
    <div class="brand">TRIP</div>
    <div class="sub">لوحة حماية — افصل الأعطال قبل ما تكبر</div>
    <div class="rules" id="rules">
      <div>الأحمر عطل — نقرة وحدة</div>
      <div>المخطط بالأصفر تحت الصيانة — لا تلمسه</div>
      <div>الضغط على مربع فاضي يكسر لك المضاعف</div>
      <div>عندك 3 محاولات</div>
      <div class="hint">كل 4 فصلات صحيحة يرتفع المستوى، وكل شوي ينفتح نوع عطل جديد لين المستوى 30</div>
    </div>
    <div class="result" id="result" style="display:none">
      <b id="rScore">0</b><span id="rMeta"></span>
    </div>
    <button id="go">ابدأ الوردية</button>
  </div>
</div>

<script>
const CODES=["+8L1A","+8L2A","+8L3A","T1-380","T2-380","BC-01","R-PV1","R-PV2","CAP-1"];
const $=s=>document.querySelector(s);
const HOLD_MS=460;

/* difficulty curves — no plateau, they keep tightening forever */
const winMs =L=>420+1880*Math.pow(0.93,L-1);
const gapMs =L=>165+885*Math.pow(0.92,L-1);
const capOf =L=>Math.min(4+Math.floor(L/7),7);
const lockP =L=>Math.min(0.13+L*0.011,0.42);
const multCap=L=>Math.min(5+Math.floor(L/10),12);

const UNLOCKS={
  4:["عطل يبي نقرتين — الرقم داخل اللمبة يقول كم باقي","DOUBLE FAULT"],
  7:["خمسة مربعات تشتغل بنفس الوقت","5 BAYS LIVE"],
  9:["العطل الأزرق: اضغط واستمر لين يمتلئ المربع","EARTH FAULT / HOLD"],
  12:["المربع الأخضر يرجّع لك محاولة — خذه بسرعة","SPARE UNIT"],
  14:["ستة مربعات بنفس الوقت","6 BAYS LIVE"],
  17:["العطل اللي يفوتك يولّع مربع ثاني على طول","CASCADE"],
  21:["سبعة مربعات بنفس الوقت","7 BAYS LIVE"],
  24:["الإضاءة تنطفي فجأة — امشِ على ألوان اللمبات","LIGHTING FAILURE"],
  30:["عطلين يطلعون مع بعض بكل دورة","OVERLOAD"]
};

let haptics=true, phase="menu", S=null, best=0;
try{ best=Number(localStorage.getItem("trip:best"))||0; }catch(e){}

const grid=$("#grid"), bays=[];
CODES.forEach((code,i)=>{
  const b=document.createElement("button");
  b.className="bay"; b.dataset.id=i;
  b.innerHTML='<span class="tape a"></span><span class="tape b"></span>'+
    '<span class="code">'+code+'</span><span class="charge"></span><span class="lamp"></span>'+
    '<span class="legend"></span><span class="bar"></span><span class="wash"></span>';
  grid.appendChild(b);
  bays.push({el:b,legend:b.querySelector(".legend"),bar:b.querySelector(".bar"),
             lamp:b.querySelector(".lamp"),charge:b.querySelector(".charge")});
});
const livesEl=$("#lives");
for(let i=0;i<3;i++){const d=document.createElement("span");d.className="led";livesEl.appendChild(d);}

function newGame(){
  return {cells:CODES.map((code,id)=>({id,code,type:null,spawnAt:0,life:0,taps:0,holding:0})),
    score:0,lives:3,combo:0,hits:0,level:1,nextSpawn:0,nextDark:0,seq:1,log:[],
    over:false,ended:false,logDirty:true};
}
function buzz(p){ if(!haptics) return; try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
function push(t,tone){ S.log.unshift({n:S.seq++,text:t,tone}); S.log=S.log.slice(0,4); S.logDirty=true; }
function flash(i,good){ const el=bays[i].el; el.classList.remove("fxg","fxb"); void el.offsetWidth; el.classList.add(good?"fxg":"fxb"); }

let unlockTimer=null;
function banner(ar,en){
  $("#unlock .ar").textContent=ar; $("#unlock .en").textContent=en;
  $("#unlock").classList.remove("hide");
  clearTimeout(unlockTimer);
  unlockTimer=setTimeout(()=>$("#unlock").classList.add("hide"),2600);
}

function clearCell(c){ c.type=null; c.taps=0; c.holding=0; }

function ignite(t,forced){
  const idle=S.cells.filter(c=>!c.type);
  if(!idle.length) return;
  if(!forced && 9-idle.length>=capOf(S.level)) return;
  const c=idle[Math.random()*idle.length|0];
  const L=S.level, r=Math.random();
  c.taps=0; c.holding=0; c.spawnAt=t;
  if(!forced && L>=12 && S.lives<3 && r<0.05){
    c.type="spare"; c.life=1500;
  }else if(!forced && r<lockP(L)){
    c.type="lock"; c.life=Math.max(1500-(L-1)*45,800)+Math.random()*600;
  }else if(L>=9 && Math.random()<0.20){
    c.type="hold"; c.life=winMs(L)*1.7;
  }else if(L>=4 && Math.random()<0.22){
    c.type="dbl"; c.taps=2; c.life=winMs(L)*1.45;
  }else{
    c.type="fault"; c.life=winMs(L);
  }
}

function levelUp(){
  const want=1+Math.floor(S.hits/4);
  while(S.level<want){
    S.level++;
    const u=UNLOCKS[S.level];
    if(u){ banner(u[0],u[1]); push("UNLOCKED  "+u[1],"info"); buzz([15,70,15,70,15]); }
    else push("SPEED UP  LVL "+S.level,"warn");
  }
}

function scoreHit(c,t,base){
  const frac=Math.max(0,1-(t-c.spawnAt)/c.life);
  S.combo++; S.hits++;
  const m=Math.min(1+Math.floor(S.combo/4),multCap(S.level));
  S.score+=Math.round((base+frac*12)*m);
  return m;
}

function step(t){
  for(const c of S.cells){
    if(c.type==="hold"&&c.holding&&t-c.holding>=HOLD_MS){
      const m=scoreHit(c,t,20); flash(c.id,true);
      push("EARTH CLEARED  "+c.code+"  x"+m,"ok"); buzz(18); clearCell(c); levelUp(); continue;
    }
    if(!c.type||t-c.spawnAt<c.life) continue;
    if(c.type==="fault"||c.type==="dbl"||c.type==="hold"){
      S.lives--; S.combo=0; flash(c.id,false);
      push("BREAKER FAILURE  "+c.code,"bad"); buzz([70,50,70]);
      clearCell(c);
      if(S.level>=17&&S.lives>0) ignite(t,true);
      if(S.lives<=0){ S.over=true; return; }
    }else if(c.type==="lock"){
      S.score+=5; flash(c.id,true); push("LOCKOUT HELD  "+c.code,"ok"); clearCell(c);
    }else{ clearCell(c); }
  }
  if(t>=S.nextSpawn){
    ignite(t,false);
    if(S.level>=30) ignite(t,false);
    S.nextSpawn=t+gapMs(S.level)+Math.random()*180;
  }
  if(S.level>=24){
    if(!S.nextDark) S.nextDark=t+6000;
    else if(t>=S.nextDark){
      document.body.classList.add("dark");
      setTimeout(()=>document.body.classList.remove("dark"),850);
      S.nextDark=t+7000+Math.random()*6000;
    }
  }
}

function press(id){
  if(phase!=="play"||S.over) return;
  const c=S.cells[id], t=performance.now();
  if(c.type==="hold"){ c.holding=t; return; }

  if(c.type==="fault"){
    const m=scoreHit(c,t,10); flash(id,true);
    push("TRIP  "+c.code+"  x"+m,"ok"); buzz(14); clearCell(c); levelUp();
  }else if(c.type==="dbl"){
    c.taps--;
    if(c.taps>0){ flash(id,true); buzz(8); }
    else{ const m=scoreHit(c,t,22); flash(id,true);
      push("TRIP x2  "+c.code+"  x"+m,"ok"); buzz(16); clearCell(c); levelUp(); }
  }else if(c.type==="spare"){
    S.lives=Math.min(3,S.lives+1); flash(id,true);
    push("SPARE FITTED  "+c.code,"ok"); buzz([12,50,12]); clearCell(c);
  }else if(c.type==="lock"){
    S.lives--; S.combo=0; clearCell(c); flash(id,false);
    push("LOCKOUT VIOLATED  "+c.code,"bad"); buzz([50,40,50]);
    if(S.lives<=0) S.over=true;
  }else{
    S.combo=0; S.score=Math.max(0,S.score-5); flash(id,false);
    push("FALSE TRIP  "+c.code,"warn"); buzz(25);
  }
}

grid.addEventListener("pointerdown",e=>{
  const b=e.target.closest(".bay"); if(!b) return;
  e.preventDefault(); press(+b.dataset.id);
});
function release(){ if(S) S.cells.forEach(c=>{ c.holding=0; }); }
document.addEventListener("pointerup",release);
document.addEventListener("pointercancel",release);

function draw(t){
  if(!S) return;
  $("#score").textContent=String(S.score).padStart(4,"0");
  $("#lvl").textContent="LVL "+S.level;
  const m=Math.min(1+Math.floor(S.combo/4),multCap(S.level));
  const mEl=$("#mult"); mEl.textContent="x"+m; mEl.classList.toggle("hot",S.combo>=4);
  livesEl.childNodes.forEach((d,i)=>d.classList.toggle("on",i<S.lives));

  S.cells.forEach((c,i)=>{
    const b=bays[i], k=c.type||"";
    b.el.classList.toggle("fault",k==="fault");
    b.el.classList.toggle("dbl",k==="dbl");
    b.el.classList.toggle("hold",k==="hold");
    b.el.classList.toggle("lock",k==="lock");
    b.el.classList.toggle("spare",k==="spare");
    b.legend.textContent = k==="fault"?"FAULT":k==="dbl"?"FAULT x2":
      k==="hold"?"HOLD":k==="lock"?"LOCKED":k==="spare"?"SPARE":"";
    b.lamp.textContent = k==="dbl"?String(c.taps):"";
    b.bar.style.width = c.type?Math.max(0,1-(t-c.spawnAt)/c.life)*100+"%":"0";
    b.charge.style.height = (k==="hold"&&c.holding)?Math.min(1,(t-c.holding)/HOLD_MS)*100+"%":"0";
  });

  if(S.logDirty){
    $("#log").innerHTML = S.log.length
      ? S.log.map((l,i)=>'<div class="'+l.tone+'" style="opacity:'+(1-i*0.22)+'">'+
          String(l.n).padStart(3,"0")+'&nbsp; '+l.text+'</div>').join("")
      : '<div class="none">-- NO EVENTS --</div>';
    S.logDirty=false;
  }
}

function finish(){
  phase="over";
  document.body.classList.remove("dark");
  $("#unlock").classList.add("hide");
  if(S.score>best){ best=S.score; try{ localStorage.setItem("trip:best",best); }catch(e){} }
  $("#rules").style.display="none";
  $("#result").style.display="block";
  $("#rScore").textContent=S.score;
  $("#rMeta").textContent="LEVEL "+S.level+"  ·  BEST "+best;
  $("#go").textContent="مرة ثانية";
  $("#over").classList.remove("hide");
}

function loop(t){
  if(phase==="play"){ step(t); if(S.over&&!S.ended){ S.ended=true; finish(); } }
  draw(t);
  requestAnimationFrame(loop);
}

$("#go").onclick=()=>{
  S=newGame(); S.nextSpawn=performance.now()+600;
  phase="play"; $("#over").classList.add("hide");
};
$("#hap").onclick=()=>{ haptics=!haptics; $("#hap").textContent=haptics?"الاهتزاز مفعّل":"الاهتزاز مطفي"; };

S=newGame();
requestAnimationFrame(loop);
</script>
</body>
</html>
